<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Property Valuation Application (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..100,400..700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#E3E8E1; --ink:#14221B; --ink-2:#4C5B53; --line:#C9D1C8;
  --green:#0E6B4A; --green-ink:#FFFFFF; --green-soft:#D7EBE1; --red:#B3261E; --red-soft:#F7DDDA;
  --blue:#1F6F9C; --wheat:#B98512; --wheat-soft:#F6E8C6; --shadow:0 1px 2px rgba(20,34,27,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101814; --surface:#18231D; --surface-2:#223029; --ink:#E8EFE9; --ink-2:#A3B3A9; --line:#34453B;
  --green:#3FB488; --green-ink:#08160F; --green-soft:#1D3A2E; --red:#F0827A; --red-soft:#43211E;
  --blue:#6CB6DE; --wheat:#E3B64F; --wheat-soft:#3D3215; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231D; --surface-2:#223029; --ink:#E8EFE9; --ink-2:#A3B3A9; --line:#34453B;
  --green:#3FB488; --green-ink:#08160F; --green-soft:#1D3A2E; --red:#F0827A; --red-soft:#43211E;
  --blue:#6CB6DE; --wheat:#E3B64F; --wheat-soft:#3D3215; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq",serif;direction:rtl;line-height:2}
.num{font-variant-numeric:tabular-nums}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* app bar */
.hdr{position:sticky;top:0;z-index:20}
.bar{background:var(--green);color:var(--green-ink);display:flex;align-items:center;gap:10px;padding:10px 12px}
.bar h1{font-size:16px;font-weight:650;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-stretch:90%}
.bar .sub{display:block;font-size:12px;font-weight:400;opacity:.85}
.iconbtn{background:transparent;border:0;color:inherit;font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.net{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.net i{width:8px;height:8px;border-radius:50%;background:#7CF0B5;display:inline-block}
.net.off i{background:#FFB4AB}

/* generic */
.pad{padding:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
h2{font-size:17px;margin:0 0 4px;font-weight:650}
h3{font-size:14px;margin:0 0 6px;font-weight:650}
.btn{border:1.5px solid var(--green);background:var(--green);color:var(--green-ink);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.ghost{background:transparent;color:var(--green)}
.btn.warn{border-color:var(--red);background:transparent;color:var(--red)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.w{background:var(--wheat-soft);color:var(--wheat)}
.note{border-left:4px solid var(--wheat);background:var(--wheat-soft);padding:8px 10px;border-radius:0 8px 8px 0;font-size:13px}
.note.r{border-color:var(--red);background:var(--red-soft)}
.note.g{border-color:var(--green);background:var(--green-soft)}
label.f{display:block;font-size:13px;color:var(--ink-2);margin-bottom:3px}
input.t,select.t{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px;min-height:42px}
input.t:focus,select.t:focus{border-color:var(--green);outline:none}
.bar-meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-meter>b{display:block;height:100%;background:var(--green)}

/* login */
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:14px}
.login .mark{font-size:30px;font-weight:700;font-stretch:88%;line-height:1.1}
.login .mark span{display:block;font-size:15px;font-weight:500;color:var(--ink-2);margin-top:6px}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}

/* home */
.circle-h{font-size:13px;font-weight:650;color:var(--ink-2);margin:16px 2px 6px}
.mz{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.mz .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mz .nm{font-weight:650;font-size:16px}

/* workspace */
.steps{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:0 0 auto;border:0;background:transparent;padding:9px 12px 7px;font-size:13px;color:var(--ink-2);border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center;white-space:nowrap}
.step b{width:20px;height:20px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;font-size:12px}
.step.on{color:var(--ink);border-color:var(--green);font-weight:650}
.step.on b{background:var(--green);color:var(--green-ink)}
.step.done b{background:var(--green-soft);color:var(--green)}
.mapwrap{scroll-margin-top:104px;position:relative;height:46vh;min-height:280px;background:#2b352e;touch-action:none;overflow:hidden}
canvas#map{width:100%;height:100%;display:block;touch-action:none}
.maptools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.maptools button{width:38px;height:38px;border-radius:9px;border:0;background:rgba(255,255,255,.94);color:#14221B;font-size:18px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.maptools button.txt{font-size:11px;font-weight:650}
.mapbadge{position:absolute;left:8px;top:8px;background:rgba(20,34,27,.82);color:#fff;border-radius:8px;padding:5px 9px;font-size:12px;max-width:70%}
.drawbar{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,34,27,.9);color:#fff;border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;font-size:13px}
.drawbar .btn{min-height:38px;padding:6px 10px;font-size:13px}
.drawbar .btn.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.panel{flex:1;padding:12px 12px 150px}
.arealist .it{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.arealist .it:first-child{border-top:0}
.sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,.25)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip.on{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:650}
.rates .cls{border-top:1px solid var(--line);padding:10px 0}
.rates .cls:first-child{border-top:0;padding-top:0}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.check i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto;margin-top:1px}
.check.ok i{background:var(--green);color:var(--green-ink)}
.check.no i{background:var(--red-soft);color:var(--red)}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.chain li i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
.chain li.done i{background:var(--green);border-color:var(--green)}
.chain li.now i{border-color:var(--wheat);background:var(--wheat)}
table.res{width:100%;border-collapse:collapse;font-size:13px}
table.res td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
table.res td:last-child{text-align:right}
table.res tr:first-child td{border-top:0}
table.wide td{padding:5px 8px;text-align:right;white-space:nowrap}
table.wide td:first-child{text-align:left;padding-left:0}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;pointer-events:none}
.foot>div{pointer-events:auto;width:100%;max-width:520px;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px}
html[dir=rtl] body{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq","Archivo",system-ui,sans-serif;line-height:2}
html[dir=rtl] .btn,html[dir=rtl] .chip,html[dir=rtl] .step,html[dir=rtl] .pill{line-height:1.9}
html[dir=rtl] table.res td:last-child{text-align:left}
html[dir=rtl] .num,html[dir=rtl] input.num{direction:ltr;unicode-bidi:plaintext}
html[dir=rtl] .note{border-left:0;border-right:4px solid var(--wheat);border-radius:8px 0 0 8px}
@media print{ #app,.foot,.toast{display:none!important} .scrim{position:static;background:none;display:block} .sheet{max-height:none;overflow:visible;max-width:none;border-radius:0} .noprint{display:none!important} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================================
   Patwari Field App (prototype). Implements SRS 3.2 to 3.8 on sample data.
   The map is simulated: Mauza shapes are invented; names and IDs are from
   the client's CLRMIS Mauza inventory. Land is held as a grid of 4 m cells,
   so areas never overlap and coverage can reach exactly 100%.
   ========================================================================= */
const CELL = 4;                       // metres per grid cell
const SQFT_PER_M2 = 10.7639;
const CELL_SQFT = CELL * CELL * SQFT_PER_M2;
const CLASSES = ["Agricultural", "Residential", "Commercial", "Industrial", "Barren"];
const STRUCT = ["Residential", "Commercial", "Industrial"];
const TYPES = ["General", "Housing society", "Abadi Deh", "Industrial zone", "Commercial market"];
const UNITS = [["acre", "Acre", 160], ["kanal", "Kanal", 20], ["marla", "Marla", 1], ["sqft", "Sq ft", 0]];
const COLORS = [[46,139,87],[66,110,180],[170,95,160],[200,120,50],[60,150,160],[150,140,60],[190,80,90],[100,100,170],[90,160,90],[160,110,80]];
const USER = { name: "Muhammad Aslam", role: "Patwari", path: "Bahawalpur Division, Bahawalnagar District, Bahawalnagar Tehsil, Revenue Circle Bahawalnagar" };

/* ---------- sample territory (names and IDs from the inventory) ---------- */
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function makeShape(seed, R){
  const r = rng(seed), n = 10, pts = [];
  for (let k = 0; k < n; k++){
    const a = (k / n) * Math.PI * 2 + (r() - .5) * .25;
    const rad = R * (0.72 + r() * 0.42);
    pts.push([Math.cos(a) * rad * 1.15, Math.sin(a) * rad * 0.92]);
  }
  return pts;
}
const MAUZAS = [
  { id:"SYS-0001", idNote:"No Mouza ID in inventory", name:"Amar Singh", ur:"امرسنگھ", circle:"Bahawalnagar-I", seed:11, R:820, shapeName:"Slanted rectangle", poly:[[-900,-500],[700,-620],[950,380],[-780,560]] },
  { id:"SYS-0002", idNote:"No Mouza ID in inventory", name:"Bahawalnagar", ur:"بہاولنگر", circle:"Bahawalnagar-I", seed:23, R:900, shapeName:"L-shaped", poly:[[-800,-700],[300,-700],[300,-50],[900,-50],[900,700],[-800,700]] },
  { id:"34164", name:"Mandi Bahawalnagar", ur:"منڈی بہاولنگر", circle:"Bahawalnagar-I", seed:37, R:760, shapeName:"Irregular, many corners" },
  { id:"SYS-0004", idNote:"No Mouza ID in inventory", name:"Qasba Bahawalnagar", ur:"قصبہ بہاولنگر", circle:"Bahawalnagar-I", seed:41, R:700, shapeName:"Small five-sided", poly:[[0,-600],[620,-180],[400,560],[-420,540],[-640,-160]] },
  { id:"34362", name:"Hussain Abad Sharqi", ur:"حسین آباد شرقی", circle:"Bahawalnagar-Qasba-II", seed:53, R:1100, shapeName:"Long strip along a canal", poly:[[-1300,-250],[-400,-380],[500,-300],[1300,-120],[1250,260],[300,330],[-600,250],[-1320,180]] },
  { id:"SYS-0006", idNote:"No Mouza ID in inventory", name:"Islampura", ur:"اسلام پورہ", circle:"Bahawalnagar-Qasba-II", seed:67, R:800, shapeName:"T-shaped with two notches", poly:[[-700,-600],[700,-600],[700,-100],[250,-100],[250,650],[-250,650],[-250,-100],[-700,-100]] },
];
MAUZAS.forEach(m => {
  m.poly = m.poly || makeShape(m.seed, m.R);
  const r = rng(m.seed * 7), ang = r() * Math.PI, L = m.R * 2.2, off = (r() - .5) * m.R * .5;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  m.loaded = [23, 41, 67].includes(m.seed) ? [] : [{ rid:"PHW-" + (200 + m.seed), name: m.seed % 2 ? "Bahawalnagar\u2013Chishtian Road" : "Bahawalnagar\u2013Minchinabad Road", cat:"Punjab highway",
    pts:[[-dx*L - dy*off, -dy*L + dx*off],[ -dy*off + dx*L*0.1, dx*off + dy*L*0.1 + 40],[dx*L - dy*off, dy*L + dx*off]] }];
});

/* ---------- geometry ---------- */
function pip(x, y, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function segNearest(px, py, ax, ay, bx, by){
  const vx = bx - ax, vy = by - ay, L2 = vx*vx + vy*vy;
  let t = L2 ? ((px - ax) * vx + (py - ay) * vy) / L2 : 0; t = Math.max(0, Math.min(1, t));
  const x = ax + t * vx, y = ay + t * vy; return [x, y, Math.hypot(px - x, py - y)];
}
function distToLine(px, py, pts){ let d = Infinity; for (let i = 0; i < pts.length - 1; i++){ const s = segNearest(px, py, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]); if (s[2] < d) d = s[2]; } return d; }
function nearestOnRing(px, py, poly){ let best = null; for (let i = 0; i < poly.length; i++){ const a = poly[i], b = poly[(i+1) % poly.length]; const s = segNearest(px, py, a[0], a[1], b[0], b[1]); if (!best || s[2] < best[2]) best = s; } return best; }
function centroid(poly){ let x = 0, y = 0; poly.forEach(p => { x += p[0]; y += p[1]; }); return [x / poly.length, y / poly.length]; }
function sampleLine(pts, step){
  const out = [];
  for (let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i+1], L = Math.hypot(b[0]-a[0], b[1]-a[1]), n = Math.max(1, Math.ceil(L / step));
    for (let k = 0; k < n; k++) out.push([a[0] + (b[0]-a[0]) * k / n, a[1] + (b[1]-a[1]) * k / n]);
  }
  out.push(pts[pts.length - 1]); return out;
}

/* ---------- Mauza grid model ---------- */
class MauzaModel {
  constructor(def){
    this.def = def;
    const xs = def.poly.map(p => p[0]), ys = def.poly.map(p => p[1]);
    this.minx = Math.min(...xs) - CELL; this.miny = Math.min(...ys) - CELL;
    this.W = Math.ceil((Math.max(...xs) - this.minx) / CELL) + 1;
    this.H = Math.ceil((Math.max(...ys) - this.miny) / CELL) + 1;
    this.inside = new Uint8Array(this.W * this.H);
    this.owner = new Uint8Array(this.W * this.H);
    this.total = 0;
    for (let j = 0; j < this.H; j++) for (let i = 0; i < this.W; i++){
      if (pip(this.cx(i), this.cy(j), def.poly)){ this.inside[j * this.W + i] = 1; this.total++; }
    }
    this.centre = centroid(def.poly);
  }
  cx(i){ return this.minx + (i + .5) * CELL; }
  cy(j){ return this.miny + (j + .5) * CELL; }
  cellAt(x, y){ const i = Math.floor((x - this.minx) / CELL), j = Math.floor((y - this.miny) / CELL); return (i < 0 || j < 0 || i >= this.W || j >= this.H) ? -1 : j * this.W + i; }
  isInside(x, y){ const c = this.cellAt(x, y); return c >= 0 && this.inside[c] === 1; }
  /* boundary lock (PA-11): a point outside the Mauza is pulled onto the boundary */
  clamp(x, y){
    if (this.isInside(x, y)) return [x, y, false];
    const n = nearestOnRing(x, y, this.def.poly);
    let px = n[0], py = n[1];
    if (!this.isInside(px, py)){ const ci = Math.floor((px - this.minx) / CELL), cj = Math.floor((py - this.miny) / CELL); let best = null;
      for (let r = 1; r <= 6 && !best; r++) for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++){ const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= this.W || j >= this.H || !this.inside[j * this.W + i]) continue; const d = di*di + dj*dj; if (!best || d < best[2]) best = [this.cx(i), this.cy(j), d]; }
      if (best){ px = best[0]; py = best[1]; } }
    return [px, py, true];
  }
  assign(poly, id){
    const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
    const i0 = Math.max(0, Math.floor((Math.min(...xs) - this.minx) / CELL)), i1 = Math.min(this.W - 1, Math.ceil((Math.max(...xs) - this.minx) / CELL));
    const j0 = Math.max(0, Math.floor((Math.min(...ys) - this.miny) / CELL)), j1 = Math.min(this.H - 1, Math.ceil((Math.max(...ys) - this.miny) / CELL));
    let n = 0, blocked = 0;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
      const c = j * this.W + i; if (!this.inside[c]) continue;
      if (!pip(this.cx(i), this.cy(j), poly)) continue;
      if (this.owner[c]) { blocked++; continue; }
      this.owner[c] = id; n++;
    }
    return { n, blocked };
  }
  /* a point tapped inside a saved property area is moved to that area's edge */
  freeNear(x, y){
    const c = this.cellAt(x, y); if (c < 0 || !this.owner[c]) return null;
    const ci = c % this.W, cj = (c - ci) / this.W;
    for (let r = 1; r < 400; r++){ let best = null, bd = Infinity;
      for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++){
        if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
        const i = ci + di, j = cj + dj; if (i < 0 || j < 0 || i >= this.W || j >= this.H) continue;
        const q = j * this.W + i; if (!this.inside[q] || this.owner[q]) continue;
        const d = di * di + dj * dj; if (d < bd){ bd = d; best = [this.cx(i), this.cy(j)]; } }
      if (best) return best; }
    return null;
  }
  /* a drawn line may not run through a saved property area: it stops at the edge */
  stopAtSaved(a, b){
    const s = sampleLine([a, b], CELL / 2), RUN = 8;
    for (let k = 1; k < s.length; k++){
      const c = this.cellAt(s[k][0], s[k][1]); if (c < 0 || !this.owner[c]) continue;

const STEPS = ["Marla size", "Property areas", "Roads", "Base values", "Road factors", "Submit"];
function stepDone(k){ const s = cur.st;
  if (k === 0) return !!s.marla;
  if (k === 1) return coverage() >= 1 && s.areas.length > 0;
  if (k === 2) return s.roadsDone;
  if (k === 3) return s.areas.length > 0 && s.areas.every(a => a.ratesSaved);
  if (k === 4) return s.areas.length > 0 && s.areas.every(a => a.factorsSaved);
  return s.stage > myStage(); }
function coverage(){ return cur.model.covered() / cur.model.total; }

  line(x1, y1, x2, y2){ this.cur.ops.push(`0.75 0.78 0.75 RG 0.6 w ${x1} ${y1} m ${x2} ${y2} l S`); }

function shrinkImage(file, cb){ const fr = new FileReader(); fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 240 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", 0.7)); }; im.onerror = () => cb(null); im.src = fr.result; }; fr.readAsDataURL(file); }
function collectApp(ev){ const a = ev.app, v = id => { const el = document.getElementById(id); return el ? el.value.trim() : undefined; }, set = (k, id) => { const x = v(id); if (x !== undefined) a[k] = x; };
  set("firmName", "ap-firm"); set("authPerson", "ap-auth"); set("name", "ap-name"); set("cnic", "ap-cnic"); if (a.cnic) a.cnic = cnicDigits(a.cnic); set("mobile", "ap-mobile"); set("ntn", "ap-ntn"); set("address", "ap-addr"); set("otherOrg", "ap-oorg"); set("otherReg", "ap-oreg"); set("experience", "ap-exp"); set("orgs", "ap-orgs");
  if (document.querySelector("[data-apd]")) a.districts = [...document.querySelectorAll("[data-apd]:checked")].map(c => ({ name: c.dataset.apd, pkgId: +document.querySelector(`[data-app="${CSS.escape(c.dataset.apd)}"]`).value })); return ev; }
